name: Rollback

# Volta produção para uma baseline já publicada (Release vX.Y.Z), sem rebuild.
# Promove a imagem que a Release já tinha no GHCR (ADR 0002) e marca a Release como Latest.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag da Release que deve voltar ao ar (ex.: v0.0.8)'
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: producao
  cancel-in-progress: false

jobs:
  rollback:
    name: Rollback de produção para ${{ inputs.tag }}
    runs-on: ubuntu-latest
    environment: production
    env:
      TAG: ${{ inputs.tag }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
      PROD_URL: ${{ vars.PROD_URL }}
    steps:
      - name: Checkout com tags
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Conferir que a tag é uma Release existente
        id: alvo
        run: |
          gh release view "$TAG" > /dev/null || { echo "::error::Release $TAG não existe."; exit 1; }
          SHA=$(git rev-list -n 1 "$TAG")
          echo "sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "imagem=ghcr.io/${GITHUB_REPOSITORY,,}:sha-${SHA::7}" >> "$GITHUB_OUTPUT"
          echo "Release $TAG -> commit $SHA"

      - uses: docker/setup-buildx-action@v3

      - name: Login no GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Apontar latest para a imagem da Release (sem rebuild)
        env:
          IMAGEM: ${{ steps.alvo.outputs.imagem }}
        run: docker buildx imagetools create -t "ghcr.io/${GITHUB_REPOSITORY,,}:latest" "$IMAGEM"

      - name: Deploy no Render
        if: env.RENDER_DEPLOY_HOOK != ''
        env:
          IMAGEM: ${{ steps.alvo.outputs.imagem }}
        run: |
          IMG=$(node -e 'console.log(encodeURIComponent(process.argv[1]))' "$IMAGEM")
          curl -fsS -X POST "${RENDER_DEPLOY_HOOK}&imgURL=${IMG}" > /dev/null
          echo "Deploy solicitado: $IMAGEM"

      - name: Smoke test (o /health precisa mostrar o commit da Release)
        if: env.RENDER_DEPLOY_HOOK != '' && env.PROD_URL != ''
        run: node scripts/smoke-test.js "$PROD_URL" "${{ steps.alvo.outputs.sha }}" --tentativas 60

      - name: Marcar a Release como Latest
        run: gh release edit "$TAG" --latest

      - name: Resumo
        run: |
          {
            echo "### Rollback para $TAG"
            echo "- Commit: ${{ steps.alvo.outputs.sha }}"
            echo "- Imagem: ${{ steps.alvo.outputs.imagem }}"
            echo "- Aprovado em Review deployments por: ${{ github.actor }} (environment production)"
          } >> "$GITHUB_STEP_SUMMARY"
